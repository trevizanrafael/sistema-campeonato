<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="grungeDarkFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.05
        0 0 0 0 0.05
        0 0 0 0 0.05
        1 0 0 0 0" result="coloredNoise"/>
      <feBlend in="SourceGraphic" in2="coloredNoise" mode="multiply"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <!-- Diagonal scratches and geometric combat slashes -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5">
    <line x1="-50" y1="100" x2="300" y2="450" />
    <line x1="20" y1="80" x2="380" y2="440" stroke-width="0.8"/>
    <line x1="400" y1="50" x2="750" y2="400" stroke-width="2"/>
    <line x1="450" y1="40" x2="800" y2="390" stroke-width="0.5"/>
    <line x1="100" y1="500" x2="450" y2="850" stroke-width="1.2"/>
  </g>
  <!-- Red accent strokes embedded in dark grunge -->
  <g opacity="0.08" stroke="#b60000" stroke-width="3">
    <line x1="-20" y1="200" x2="350" y2="570" />
    <line x1="500" y1="100" x2="850" y2="450" />
  </g>
  <!-- Subtle specks -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="190" r="2"/>
    <circle cx="450" cy="120" r="1"/>
    <circle cx="620" cy="340" r="2.5"/>
    <circle cx="710" cy="180" r="1.5"/>
    <circle cx="190" cy="420" r="2"/>
    <circle cx="340" cy="510" r="1.5"/>
    <circle cx="560" cy="480" r="2"/>
  </g>
</svg>
